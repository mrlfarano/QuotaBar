name: Bug report
description: Something renders wrong, errors out, or stops updating
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Most source problems show up as an error row in
        the menu — copy that exact text, it usually pinpoints the cause.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.6 (arm64)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QuotaBar version
      description: From the release zip name, or `git rev-parse --short HEAD` if built from source.
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Which source?
      options:
        - Z.AI Coding Plan (zai)
        - Claude Pro/Max (claude)
        - Codex (codex)
        - GitHub (github)
        - Custom source
        - UI / rendering / not source-specific
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Menu error row / probe output
      description: |
        Exact error text from the menu, and output of
        `.build/release/quotabar --probe <source>` with any tokens redacted.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
