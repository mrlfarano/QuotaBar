name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: ./scripts/make-app.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Zip bundle
        working-directory: build
        run: zip -r -q "QuotaBar-${GITHUB_REF_NAME}.zip" QuotaBar.app

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/QuotaBar-${GITHUB_REF_NAME}.zip" \
            --title "QuotaBar $GITHUB_REF_NAME" \
            --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" \
                 "build/QuotaBar-${GITHUB_REF_NAME}.zip" --clobber
