name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (release)
        run: swift build -c release

      - name: Unit tests
        run: swift test

      # Each --parse* flag exits nonzero when the fixture yields no gauges,
      # so a silent parser regression fails the step. Output (the gauges
      # themselves) lands in the job log.
      - name: Offline parser checks
        run: |
          set -euo pipefail
          bin=".build/release/quotabar"
          $bin --parse             testdata/payload_real.json
          $bin --parse             testdata/payload_a.json
          $bin --parse             testdata/payload_b.json
          $bin --parse             testdata/payload_c.json
          $bin --parse-claude      testdata/claude-usage.json
          $bin --parse-codex       testdata/codex-usage.json
          $bin --parse-openrouter  testdata/openrouter-credits.json
          $bin --parse-copilot     testdata/copilot-user.json
          $bin --parse-antigravity testdata/antigravity-userstatus.json
          $bin --parse-custom      testdata/custom-config.json testdata/custom-payload.json

      - name: App bundle builds
        run: ./scripts/make-app.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record Swift parser output
        run: node windows/scripts/parser-parity.js --record .build/release/quotabar swift-parser-output.json

      - uses: actions/upload-artifact@v4
        with:
          name: swift-parser-output
          path: swift-parser-output.json

  windows:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Electron tray and settings integration
        run: npm run test:electron

      - uses: actions/download-artifact@v4
        with:
          name: swift-parser-output
          path: windows/build/parity

      - name: Compare Windows and Swift parser output
        run: node scripts/parser-parity.js --compare build/parity/swift-parser-output.json

      # Each --parse* flag exits nonzero when the fixture yields no gauges.
      # The Windows port must stay byte-identical to the Swift binary above.
      - name: Offline parser checks
        run: |
          node src/cli.js --parse             ../testdata/payload_real.json
          node src/cli.js --parse             ../testdata/payload_a.json
          node src/cli.js --parse             ../testdata/payload_b.json
          node src/cli.js --parse             ../testdata/payload_c.json
          node src/cli.js --parse-claude      ../testdata/claude-usage.json
          node src/cli.js --parse-codex       ../testdata/codex-usage.json
          node src/cli.js --parse-openrouter  ../testdata/openrouter-credits.json
          node src/cli.js --parse-copilot     ../testdata/copilot-user.json
          node src/cli.js --parse-antigravity ../testdata/antigravity-userstatus.json
          node src/cli.js --parse-custom      ../testdata/custom-config.json ../testdata/custom-payload.json

      - name: Package smoke build (exe + icon + metadata)
        run: npm run package:win

      - name: Packaged executable smoke tests
        run: npm run test:package

      - name: Build installer
        run: npm run package:installer

      - name: Install, upgrade, and uninstall checks
        run: npm run test:installer

      - name: Bundle verified Windows release
        run: ./scripts/bundle-release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-bundle
          path: |
            windows/out/*-Setup-x64.exe
            windows/out/*-win32-x64.zip
            windows/out/SHA256SUMS.txt
